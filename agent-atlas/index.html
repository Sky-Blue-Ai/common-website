<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<title>AI Agent 论文与大事件图谱 · 2021–2026</title>
<style>
:root{
  --paper:#f7f2e7; --card:#fffdf7; --card-2:#fbf6ec;
  --ink:#2b2620; --ink-2:#6b6255; --ink-3:#857a67;
  --line:#e4dac7; --line-soft:#eee5d4;
  --accent:#b4552d; --accent-soft:#f0e2d3;
  --green:#4f6b5d; --gold:#8a6b3f;
  --serif:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(120,100,70,.055) 1px, transparent 1px);
  background-size:4px 4px;
}
.wrap{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 18px}
header{padding:34px 0 18px; border-bottom:1px solid var(--line)}
.kicker{
  font-family:var(--serif); font-size:11.5px; letter-spacing:.28em; color:var(--accent);
  text-transform:uppercase; margin-bottom:10px;
}
h1{
  font-family:var(--serif); font-weight:600; font-size:27px; line-height:1.28;
  margin:0 0 10px; letter-spacing:.01em;
}
.sub{color:var(--ink-2); font-size:13px; line-height:1.7; margin:0}
.sub b{color:var(--ink); font-weight:600}
.stats{display:flex; gap:18px; margin-top:16px; flex-wrap:wrap}
.stat{font-size:12px; color:var(--ink-2)}
.stat b{display:block; font-family:var(--serif); font-size:19px; color:var(--ink); font-weight:600}
.toolbar{position:sticky; top:0; z-index:20; background:rgba(247,242,231,.94);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:12px 0 10px; margin:0 -18px; padding-left:18px; padding-right:18px}
.search{display:flex; align-items:center; gap:9px; background:var(--card);
  border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.search svg{flex:0 0 auto; opacity:.45}
.search input{border:0; outline:0; background:transparent; font-size:14.5px; color:var(--ink);
  width:100%; font-family:var(--sans)}
.search input::placeholder{color:var(--ink-3)}
.tabs{display:flex; gap:6px; margin-top:10px}
.tab{
  flex:1; text-align:center; padding:8px 4px; font-size:13.5px; border-radius:7px;
  border:1px solid transparent; color:var(--ink-2); cursor:pointer; user-select:none;
  background:transparent; font-family:var(--sans); transition:.15s;
}
.tab.on{background:var(--card); border-color:var(--line); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent), 0 1px 0 rgba(120,100,70,.05)}
.chips{display:flex; gap:7px; flex-wrap:nowrap; overflow-x:auto; padding:10px 26px 2px 0;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 26px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; font-size:12.5px; padding:5px 11px; border-radius:20px; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--ink-2); transition:.15s;
}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fbf6ec}
.chip.fav.on{background:var(--accent); border-color:var(--accent); color:#fff8f0}
main{padding-top:6px; min-height:50vh}
.yearmark{
  display:flex; align-items:center; gap:12px; margin:26px 0 12px;
  font-family:var(--serif); font-size:15px; color:var(--ink-2); letter-spacing:.06em;
}
.yearmark::after{content:""; flex:1; height:1px; background:var(--line)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:14px 15px; margin-bottom:10px; cursor:pointer; position:relative;
  transition:.16s; box-shadow:0 1px 1px rgba(120,100,70,.03);
}
.card:active{transform:scale(.995); background:var(--card-2)}
.card .row1{display:flex; align-items:flex-start; gap:8px}
.card h3{
  font-family:var(--serif); font-size:15.5px; font-weight:600; margin:0; line-height:1.45; flex:1;
}
.badge{
  flex:0 0 auto; font-size:10.5px; padding:2px 7px; border-radius:4px; letter-spacing:.04em;
  border:1px solid var(--line); color:var(--ink-2); background:var(--card-2); white-space:nowrap;
}
.badge.奠基{background:var(--accent); border-color:var(--accent); color:#fff8f0}
.badge.高影响{border-color:#d9c3a3; color:var(--gold); background:#faf1e2}
.badge.前沿{border-color:#cbd6cc; color:var(--green); background:#eef2ec}
.meta{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-3); margin-top:6px}
.meta span{white-space:nowrap}
.contribution{font-size:13.5px; color:var(--ink-2); margin-top:8px; line-height:1.6}
.flags{position:absolute; top:10px; right:10px; display:flex; gap:4px}
.flag{font-size:11px; opacity:.9}
.ev{display:flex; gap:12px; padding:13px 0; border-bottom:1px dashed var(--line-soft); cursor:pointer}
.ev:last-child{border-bottom:0}
.evdate{flex:0 0 62px; font-family:var(--serif); font-size:12px; color:var(--accent); padding-top:2px; letter-spacing:.02em}
.evbody{flex:1}
.evtitle{font-family:var(--serif); font-size:15px; font-weight:600; line-height:1.45; margin:0}
.evmeta{font-size:12px; color:var(--ink-2); margin-top:4px}
.evdesc{font-size:13px; color:var(--ink-2); margin-top:4px; line-height:1.6}
.cat{display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:3px; margin-right:6px;
  border:1px solid var(--line); color:var(--ink-2)}
.cat.模型发布{color:#8a6b3f;border-color:#e0cbaa;background:#faf2e4}
.cat.Agent产品{color:#a14a2a;border-color:#e8c9b8;background:#fbeee6}
.cat.协议标准{color:#4f6b5d;border-color:#c9d6ca;background:#eef2ec}
.cat.融资并购{color:#7a5a8a;border-color:#ddcfe4;background:#f4eef7}
.cat.政策监管{color:#5a6b7a;border-color:#ccd6de;background:#eef2f6}
.cat.算力硬件{color:#8a6b3f;border-color:#e0cbaa;background:#faf2e4}
.cat.学术荣誉{color:#8a6b3f;border-color:#e0cbaa;background:#faf2e4}
.cat.安全与风险{color:#9a4a4a;border-color:#e6cccc;background:#faeeee}
.stage{
  background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:16px; margin-bottom:12px; position:relative;
}
.stage .idx{
  position:absolute; right:14px; top:12px; font-family:var(--serif); font-size:34px;
  color:var(--accent-soft); line-height:1; font-weight:600;
}
.stage h3{font-family:var(--serif); font-size:16px; margin:0 0 4px; font-weight:600; padding-right:58px}
.stage .tm{font-size:12px; color:var(--accent); margin-bottom:8px}
.stage p{margin:0 0 8px; font-size:13.5px; color:var(--ink-2); line-height:1.65}
.stage .rep{font-size:12.5px; color:var(--ink-3); border-top:1px dashed var(--line-soft); padding-top:8px}
.empty{text-align:center; color:var(--ink-3); padding:56px 0; font-size:13.5px}
/* modal */
.mask{position:fixed; inset:0; background:rgba(43,38,32,.34); backdrop-filter:blur(2px); z-index:60;
  display:none; align-items:flex-end; justify-content:center}
.mask.on{display:flex}
.sheet{
  background:var(--paper); width:100%; max-width:760px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:20px 20px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 34px rgba(60,45,25,.16); animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.sheet .close{position:sticky; top:0; float:right; background:var(--card); border:1px solid var(--line);
  width:30px; height:30px; border-radius:50%; color:var(--ink-2); font-size:15px; cursor:pointer; line-height:1}
.sheet h2{font-family:var(--serif); font-size:19px; line-height:1.42; margin:2px 36px 8px 0; font-weight:600}
.sheet .kv{display:flex; gap:8px; font-size:13px; color:var(--ink-2); margin-bottom:6px}
.sheet .kv b{color:var(--ink-3); font-weight:400; flex:0 0 44px}
.sheet .body{font-size:14px; color:var(--ink-2); line-height:1.75; margin:12px 0; padding:12px 0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.sheet a{color:var(--accent); text-decoration:none; border-bottom:1px solid #e0c3b0; word-break:break-all; font-size:13px}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.btn{font-family:var(--sans); font-size:13px; padding:8px 13px; border-radius:7px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}
.btn.on{background:var(--accent); border-color:var(--accent); color:#fff8f0}
.note{margin-top:14px}
.note label{font-size:12px; color:var(--ink-3); display:block; margin-bottom:5px}
.note textarea{width:100%; min-height:76px; resize:vertical; background:var(--card);
  border:1px solid var(--line); border-radius:7px; padding:10px; font-family:var(--sans);
  font-size:13.5px; color:var(--ink); line-height:1.6; outline:0}
.note textarea:focus{border-color:#d3c1a4}
footer{max-width:760px; margin:34px auto 0; padding:16px 18px 0; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--ink-3); line-height:1.8}
.footacts{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.mini{font-size:11.5px; padding:5px 9px; border-radius:5px; border:1px solid var(--line);
  background:transparent; color:var(--ink-2); cursor:pointer; font-family:var(--sans)}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('atlas.'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('atlas.'+k, JSON.stringify(v)); }catch(e){} }
};
let fav = new Set(STORE.get('fav',[]));
let read = new Set(STORE.get('read',[]));
let notes = STORE.get('notes',{});
const state = { view:'papers', q:'', filter:'', onlyFav:false };

const DIRS = ['全部','奠基必读','基础方法','工具使用','规划','记忆与反思','记忆与上下文','多智能体','框架与工程','软件工程','具身智能','具身与 GUI','训练与 RL','评测基准','综述','架构与综述','实证研究','应用','协议与综述'];
const CATS = ['全部','模型发布','Agent 产品','协议标准','融资并购','政策监管','算力硬件','学术荣誉','安全与风险'];
const pid = p => 'p:'+p.arxiv;
const eid = e => 'e:'+e.date+'|'+e.title;

function saveFav(){ STORE.set('fav',[...fav]); }
function saveRead(){ STORE.set('read',[...read]); }
function stats(){
  $('#s3').textContent = read.size;
  $('#s4').textContent = fav.size;
}

function chipsFor(view){
  const box = $('#chips');
  if(view==='papers'){
    box.innerHTML = DIRS.map(d=>`<button class="chip ${state.filter===d?'on':''}" data-f="${esc(d)}">${esc(d)}</button>`).join('')
      + `<button class="chip fav ${state.onlyFav?'on':''}" id="favchip">只看收藏</button>`;
  } else if(view==='events'){
    box.innerHTML = CATS.map(c=>`<button class="chip ${state.filter===c?'on':''}" data-f="${esc(c)}">${esc(c)}</button>`).join('');
  } else {
    box.innerHTML = '';
  }
}

function matchPaper(p){
  if(state.onlyFav && !fav.has(pid(p))) return false;
  if(state.filter==='奠基必读'){ if(p.impact!=='奠基') return false; }
  else if(state.filter && state.filter!=='全部' && p.direction!==state.filter) return false;
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  return [p.title,p.org,p.contribution,p.direction,p.impact].join(' ').toLowerCase().includes(q);
}
function matchEvent(e){
  if(state.filter && state.filter!=='全部' && e.cat!==state.filter) return false;
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  return [e.title,e.who,e.desc,e.cat,e.date].join(' ').toLowerCase().includes(q);
}

function renderPapers(){
  const list = DATA.papers.filter(matchPaper)
    .sort((a,b)=> a.date<b.date?1:-1);
  if(!list.length) return empty();
  let out='', lastYear='';
  for(const p of list){
    const y = p.date.slice(0,4);
    if(y!==lastYear){ out += `<div class="yearmark">${y}</div>`; lastYear=y; }
    const isF = fav.has(pid(p)), isR = read.has(pid(p));
    out += `<div class="card" data-id="${esc(pid(p))}" data-kind="p">
      <div class="row1">
        <h3>${esc(p.title)}</h3>
        <span class="badge ${esc(p.impact)}">${esc(p.impact)}</span>
      </div>
      <div class="meta"><span>${esc(p.date)}</span><span>${esc(p.org)}</span><span>${esc(p.direction)}</span></div>
      <div class="contribution">${esc(p.contribution)}</div>
      ${(isF||isR)?`<div class="flags">${isF?'<span class="flag">★</span>':''}${isR?'<span class="flag">✓</span>':''}</div>`:''}
    </div>`;
  }
  $('#main').innerHTML = out;
}

function renderEvents(){
  const list = DATA.events.filter(matchEvent).sort((a,b)=> a.date<b.date?1:-1);
  if(!list.length) return empty();
  let out='', lastYear='';
  for(const e of list){
    const y = e.date.slice(0,4);
    if(y!==lastYear){ out += `<div class="yearmark">${y}</div>`; lastYear=y; }
    const isF = fav.has(eid(e));
    out += `<div class="ev" data-id="${esc(eid(e))}" data-kind="e">
      <div class="evdate">${esc(e.date.slice(5))}</div>
      <div class="evbody">
        <p class="evtitle">${esc(e.title)} ${isF?'<span class="flag">★</span>':''}</p>
        <div class="evmeta"><span class="cat ${esc(e.cat)}">${esc(e.cat)}</span>${esc(e.who)}</div>
        <div class="evdesc">${esc(e.desc)}</div>
      </div>
    </div>`;
  }
  $('#main').innerHTML = out;
}

function renderStages(){
  $('#main').innerHTML = DATA.stages.map((s,i)=>`
    <div class="stage">
      <div class="idx">0${i+1}</div>
      <h3>${esc(s.stage)}</h3>
      <div class="tm">${esc(s.time)}</div>
      <p>${esc(s.feature)}</p>
      <div class="rep">代表：${esc(s.rep)}</div>
    </div>`).join('');
}

function empty(){ $('#main').innerHTML = '<div class="empty">没有匹配的条目，换个关键词试试。</div>'; }

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.view===state.view));
  chipsFor(state.view);
  if(state.view==='papers') renderPapers();
  else if(state.view==='events') renderEvents();
  else renderStages();
  stats();
}

/* interactions */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  state.view=t.dataset.view; state.filter=''; state.onlyFav=false; render();
}));
$('#q').addEventListener('input',e=>{ state.q=e.target.value.trim(); render(); });
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  if(b.id==='favchip'){ state.onlyFav=!state.onlyFav; }
  else { state.filter = b.dataset.f; }
  render();
});

function openSheet(html){ $('#sheet').innerHTML = `<button class="close" id="closeBtn">✕</button>` + html; $('#mask').classList.add('on'); }
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeSheet(); });
document.getElementById('sheet').addEventListener('click',e=>{ if(e.target.id==='closeBtn') closeSheet(); });
function closeSheet(){ $('#mask').classList.remove('on'); }

function openPaper(p){
  const id = pid(p), isF = fav.has(id), isR = read.has(id);
  openSheet(`
    <h2>${esc(p.title)}</h2>
    <div class="kv"><b>时间</b><span>${esc(p.date)}</span></div>
    <div class="kv"><b>机构</b><span>${esc(p.org)}</span></div>
    <div class="kv"><b>方向</b><span>${esc(p.direction)} · ${esc(p.impact)}</span></div>
    <div class="body">${esc(p.contribution)}</div>
    <div class="kv"><b>原文</b><a href="https://arxiv.org/abs/${esc(p.arxiv)}" target="_blank" rel="noopener">arXiv:${esc(p.arxiv)}</a></div>
    <div class="acts">
      <button class="btn ${isR?'on':''}" data-act="read">${isR?'已读 ✓':'标记已读'}</button>
      <button class="btn ${isF?'on':''}" data-act="fav">${isF?'已收藏 ★':'收藏'}</button>
    </div>
    <div class="note">
      <label>我的笔记（只存在这台设备的浏览器里）</label>
      <textarea id="noteBox" placeholder="记一句这论文能用在哪儿…">${esc(notes[id]||'')}</textarea>
    </div>`);
  $('#sheet').querySelector('[data-act="read"]').onclick = ()=>{ read.has(id)?read.delete(id):read.add(id); saveRead(); openPaper(p); render(); };
  $('#sheet').querySelector('[data-act="fav"]').onclick = ()=>{ fav.has(id)?fav.delete(id):fav.add(id); saveFav(); openPaper(p); render(); };
  $('#noteBox').addEventListener('input',e=>{ const v=e.target.value.trim(); if(v) notes[id]=v; else delete notes[id]; STORE.set('notes',notes); });
}

function openEvent(e){
  const id = eid(e), isF = fav.has(id);
  openSheet(`
    <h2>${esc(e.title)}</h2>
    <div class="kv"><b>日期</b><span>${esc(e.date)}</span></div>
    <div class="kv"><b>主体</b><span>${esc(e.who)}</span></div>
    <div class="kv"><b>类别</b><span>${esc(e.cat)}</span></div>
    <div class="body">${esc(e.desc)}</div>
    <div class="kv"><b>来源</b><a href="${esc(e.src)}" target="_blank" rel="noopener">${esc(e.src)}</a></div>
    <div class="acts"><button class="btn ${isF?'on':''}" data-act="fav">${isF?'已收藏 ★':'收藏'}</button></div>`);
  $('#sheet').querySelector('[data-act="fav"]').onclick = ()=>{ fav.has(id)?fav.delete(id):fav.add(id); saveFav(); openEvent(e); render(); };
}

$('#main').addEventListener('click',e=>{
  const el = e.target.closest('[data-id]'); if(!el) return;
  const id = el.dataset.id;
  if(id.startsWith('p:')){
    const arxiv = id.slice(2);
    const p = DATA.papers.find(x=>x.arxiv===arxiv); if(p) openPaper(p);
  } else {
    const e2 = DATA.events.find(x=>eid(x)===id); if(e2) openEvent(e2);
  }
});

/* export / import */
$('#exp').onclick = ()=>{
  const blob = new Blob([JSON.stringify({fav:[...fav],read:[...read],notes},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='agent-atlas-my-marks.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('#imp').onclick = ()=> $('#file').click();
$('#file').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(Array.isArray(d.fav)) fav=new Set(d.fav);
    if(Array.isArray(d.read)) read=new Set(d.read);
    if(d.notes&&typeof d.notes==='object') notes=d.notes;
    saveFav(); saveRead(); STORE.set('notes',notes); closeSheet(); render();
  }catch(err){ alert('文件格式不对'); } };
  r.readAsText(f);
};
$('#clr').onclick = ()=>{ if(!confirm('清空已读、收藏和笔记？')) return; fav.clear(); read.clear(); notes={}; saveFav(); saveRead(); STORE.set('notes',notes); render(); };

$('#s1').textContent = DATA.papers.length;
$('#s2').textContent = DATA.events.length;
render();
</script>
</body>
</html>
