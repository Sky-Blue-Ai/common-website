<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>AI Agent 论文与大事件图谱 · 2021–2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Cpath d='M9 10h14M9 16h9M9 22h12' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --n50:#fafafa;--n100:#f5f5f5;--n200:#e5e5e5;--n300:#d4d4d4;--n400:#a3a3a3;
  --n500:#737373;--n600:#525252;--n700:#404040;--n900:#171717;
  --violet:#7c3aed;--violet-l:#8b5cf6;--violet-50:#f5f3ff;
  --amber:#fbbf24;--amber-d:#b45309;
  --emerald:#047857;--emerald-l:#d1fae5;
  --rose:#be123c;--rose-l:#ffe4e6;
  --cyan:#0ea5e9;--cyan-l:#e0f2fe;--cyan-d:#0369a1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--n100);color:var(--n900);line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.tile{background:#fff;border:1px solid var(--n200);border-radius:24px;padding:20px}
/* hero bento */
.hero{padding:22px 0 6px}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.b-main{grid-column:1/-1;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:0;
  border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:200px}
.b-main .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:600}
.b-main h1{font-size:25px;line-height:1.24;font-weight:800;letter-spacing:-.02em;margin:10px 0 8px}
.mb{display:inline}
@media(min-width:720px){.mb{display:none}}
.b-main p{font-size:13.5px;opacity:.94;max-width:560px}
.b-main .go{align-self:flex-start;margin-top:16px;background:#fff;color:#6d28d9;border-radius:14px;
  padding:11px 18px;font-size:13.5px;font-weight:700;text-decoration:none}
.b-num{display:flex;flex-direction:column;justify-content:center;min-height:88px}
.b-num b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.b-num span{font-size:12px;color:var(--n500);margin-top:3px}
.b-amber{background:var(--amber);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.b-amber b{font-size:21px;font-weight:800;color:#78350f;letter-spacing:-.01em;line-height:1.15}
.b-amber-t{font-size:11.5px;font-weight:700;color:#78350f;letter-spacing:.02em}
.b-amber svg{width:38px;height:38px;stroke:#78350f;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b-emerald{background:var(--emerald);border:0;color:#fff}
.b-emerald b{color:#fff}.b-emerald span{color:#ecfdf5;font-weight:600}
.b-rose{background:var(--rose);border:0;color:#fff}
.b-rose b{color:#fff}.b-rose span{color:#fff1f2;font-weight:600}
.b-wide{grid-column:1/-1}
/* toolbar */
.toolbar{position:sticky;top:0;z-index:30;background:linear-gradient(var(--n100) 74%,rgba(245,245,245,0));
  margin:0 -16px;padding:12px 16px 10px}
.tools{background:#fff;border:1px solid var(--n200);border-radius:20px;padding:10px 12px;
  display:flex;gap:9px;align-items:center;box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.search svg{width:17px;height:17px;stroke:var(--n400);stroke-width:2.2;fill:none;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--n900)}
.search input::placeholder{color:var(--n400)}
.seg{display:flex;gap:4px;background:var(--n100);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;color:var(--n600);font:inherit;font-size:12.5px;font-weight:700;
  padding:7px 11px;border-radius:11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--n900);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 22px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--n200);background:#fff;color:var(--n700);border-radius:14px;
  padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--n900);color:#fff;border-color:var(--n900)}
.chip.fav.on{background:var(--rose);border-color:var(--rose)}
.chip i{font-style:normal;opacity:.55;margin-left:5px;font-size:11px}
.count{font-size:11.5px;color:var(--n500);padding:10px 2px 4px}
/* list */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.yearmark{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin:20px 0 9px}
.yearmark b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.yearmark i{flex:1;height:1px;background:var(--n200)}
.yearmark em{font-style:normal;font-size:11px;color:var(--n400)}
.row{background:#fff;border:1px solid var(--n200);border-radius:20px;padding:14px 16px;cursor:pointer;
  transition:transform .16s,box-shadow .16s;border-left:4px solid var(--n200)}
.row:active{transform:scale(.995)}
.row:hover{box-shadow:0 10px 22px -18px rgba(0,0,0,.4)}
.r1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c0{background:var(--violet-50);color:#6d28d9}.c1{background:var(--emerald-l);color:var(--emerald)}
.c2{background:var(--rose-l);color:var(--rose)}.c3{background:#fef3c7;color:var(--amber-d)}
.c4{background:var(--cyan-l);color:var(--cyan-d)}.c5{background:var(--n100);color:var(--n700)}
.c6{background:#ede9fe;color:#5b21b6}.c7{background:#fee2e2;color:#991b1b}
.c8{background:#dbeafe;color:#1d4ed8}.c9{background:#fef9c3;color:#854d0e}
.k0{border-left-color:var(--violet-l)}.k1{border-left-color:var(--emerald)}.k2{border-left-color:var(--rose)}
.k3{border-left-color:var(--amber)}.k4{border-left-color:var(--cyan)}.k5{border-left-color:var(--n300)}
.k6{border-left-color:#7c3aed}.k7{border-left-color:#dc2626}.k8{border-left-color:#2563eb}.k9{border-left-color:#ca8a04}
.imp{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;
  border:1px solid var(--n200);color:var(--n600);background:var(--n50)}
.imp.i0{background:var(--violet);border-color:var(--violet);color:#fff}
.imp.i1{background:#fef3c7;border-color:#fde68a;color:var(--amber-d)}
.imp.i2{background:var(--n100);color:var(--n700)}
.imp.i3{background:var(--emerald-l);border-color:#a7f3d0;color:var(--emerald)}
.name{font-size:14px;font-weight:700;line-height:1.45;word-break:break-word;padding-right:2px}
.contrib{font-size:13px;color:var(--n600);margin-top:3px;word-break:break-word}
.sub{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--n500);margin-top:7px}
.flag{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--n500)}
.row{position:relative}
.pill{font-size:11px;font-weight:700;color:var(--n900);background:var(--n100);border-radius:8px;
  padding:3px 7px;white-space:nowrap}
.ev .name{font-size:14.5px}
.empty{grid-column:1/-1;text-align:center;color:var(--n500);font-size:13px;padding:44px 0}
/* stages */
.stage{background:#fff;border:1px solid var(--n200);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.stage .n{position:absolute;right:16px;top:6px;font-size:64px;font-weight:800;color:var(--n100);line-height:1;letter-spacing:-.04em}
.stage h3{font-size:15.5px;font-weight:800;margin:0 0 4px;padding-right:56px;line-height:1.4}
.stage .t{font-size:11.5px;font-weight:700;color:var(--violet);margin-bottom:8px}
.stage p{font-size:13px;color:var(--n600);line-height:1.65}
.stage .rep{font-size:11.5px;color:var(--n500);border-top:1px solid var(--n200);margin-top:10px;padding-top:9px;line-height:1.6}
footer{margin:26px 0 8px;font-size:11.5px;color:var(--n500);line-height:1.75}
footer a{color:var(--violet)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
#sheet.show{display:flex}
#sheet .mask{position:absolute;inset:0;background:rgba(23,23,23,.5);backdrop-filter:blur(3px)}
#sheet .panel{position:relative;width:min(440px,100%);max-height:86vh;overflow:auto;background:#fff;
  border-radius:22px;padding:22px 22px 20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
  animation:pop .18s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
#sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;
  background:var(--n100);color:var(--n700);font:inherit;font-size:15px;line-height:1;cursor:pointer}
#sheet h2{font-size:16.5px;font-weight:800;line-height:1.4;padding-right:38px}
#sheet .meta{font-size:12px;color:var(--n500);margin:6px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sheet .big{font-size:14.5px;line-height:1.7;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--n200);color:var(--n700)}
#sheet dl{display:grid;grid-template-columns:56px 1fr;gap:8px 10px;font-size:13px;margin:0 0 16px}
#sheet dt{color:var(--n600)}
#sheet dd{margin:0;font-weight:600;word-break:break-word}
#sheet dd a{color:var(--violet);text-decoration:none;font-weight:600}
#sheet .acts{display:flex;gap:9px;margin-bottom:12px}
#sheet .acts a,#sheet .acts button{flex:1;text-align:center;padding:11px;border-radius:14px;font:inherit;
  font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--n200);background:#fff;color:var(--n900);cursor:pointer}
#sheet .acts a{background:var(--violet);border-color:var(--violet);color:#fff}
#sheet .acts button.on{background:var(--n900);border-color:var(--n900);color:#fff}
#sheet .note label{font-size:11.5px;color:var(--n500);display:block;margin-bottom:5px}
#sheet .note textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--n200);border-radius:12px;
  padding:10px;font:inherit;font-size:13px;line-height:1.6;outline:none;color:var(--n900)}
#sheet .note textarea:focus{border-color:var(--violet-l)}
@media(min-width:720px){
  .bento{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(92px,1fr)}
  .b-main{grid-column:span 2;grid-row:span 2}
  .b-num{min-height:0}
  .b-wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 20px}
  .b-wide svg{width:26px;height:26px}
  .b-wide b{font-size:19px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .b-main h1{font-size:30px}
}
@media(min-width:1040px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="bento">
      <div class="b-main">
        <div>
          <div class="k">AI AGENT ATLAS · 2021—2026</div>
          <h1>AI Agent 论文<br class="mb">与大事件图谱</h1>
          <p>从 ReAct 到通用工作 Agent：64 篇主流论文、56 个大事件、六阶段脉络。搜索、按方向筛选、点开看要点，可标记已读与收藏。</p>
        </div>
        <a class="go" href="#list" onclick="document.getElementById('q').focus()">开始浏览 →</a>
      </div>
      <div class="tile b-num"><b id="s-total">64</b><span>篇主流论文</span></div>
      <div class="tile b-num"><b>56</b><span>个大事件</span></div>
      <div class="tile b-num"><b id="s-read">0</b><span>已读</span></div>
      <div class="tile b-num"><b id="s-fav">0</b><span>收藏</span></div>
      <div class="tile b-amber b-wide">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
        <b>2021–2026</b>
        <span class="b-amber-t">六阶段脉络</span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="搜论文、机构、事件关键词…" autocomplete="off">
      </label>
      <div class="seg">
        <button class="on" data-view="papers">论文</button>
        <button data-view="events">事件</button>
        <button data-view="stages">脉络</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="count" id="count"></div>
  <main id="list" class="grid"></main>

  <footer>
    数据整理自 arXiv 原论文与官方发布、主流媒体报道（2026-11-14）。影响力标签为编辑判断。<br>
    <a href="https://my.feishu.cn/base/HGLabeiTfaFIqTsA1OYchLOgnbd" target="_blank" rel="noopener">飞书多维表格源数据</a> ·
    <a href="../">站点目录</a>
  </footer>
</div>

<div id="sheet">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="panel" role="dialog" aria-modal="true">
    <button class="x" onclick="closeSheet()" aria-label="关闭">✕</button>
    <h2 id="s-name"></h2>
    <div class="meta" id="s-meta"></div>
    <div class="big" id="s-body"></div>
    <dl id="s-dl"></dl>
    <div class="acts">
      <button id="s-btn-read">标记已读</button>
      <button id="s-btn-fav">收藏</button>
      <a id="s-link" href="#" target="_blank" rel="noopener">查看原文</a>
    </div>
    <div class="note">
      <label>我的笔记（存在本机浏览器）</label>
      <textarea id="s-note" placeholder="记一句这条能用在哪儿…"></textarea>
    </div>
  </div>
</div>

://www.mergersight.com/post/meta-s-2bn-acquisition-of-manus"],["2026-05-05",1,"GPT-5.5 发布","agentic coding、电脑操作与知识工作能力明显提升，并成为 ChatGPT 默认模型","OpenAI","https://llmlineage.com/zh/timeline"],["2026-07-28",2,"MCP 规范改版（无状态化）","移除 initialize 握手与会话，协议更适合大规模服务化部署","MCP / AAIF","https://blog.modelcontextprotocol.io/"],["2026-08-11",6,"Manus 恢复独立运营","收购被回滚后 Manus 重回独立公司，成为跨境 AI 交易样本","Manus / Meta","https://www.cnbc.com/2026/08/11/manus-china-meta-acquisition.html"],["2026-08-27",2,"A2A 加入 Agentic AI Foundation","MCP 与 A2A 同属一个中立基金会，Agent 互操作标准收敛","A2A / AAIF","https://a2a-protocol.org/latest/blog/2026/08/27/a-new-chapter-for-a2a-joining-the-agentic-ai-foundation/"],["2026-09-22",1,"Claude Opus 5.5 发布","Claude 5.5 家族首款，主打长程 agent 与知识工作","Anthropic","https://support.claude.com/en/articles/12138966-release-notes"],["2026-10-13",1,"Gemini 4 Argon 发布","Gemini 4 系列首款旗舰，100 万 token 上下文与更强工具使用","Google DeepMind","https://www.promptzone.com/ai-model-releases"],["2026-10-22",2,"Anthropic 把 Agent Skills 捐给 AAIF","Agent 技能/工具打包格式进入中立标准化，生态互通加速","Anthropic","https://simonwillison.net/2026/Oct/22/donating-agent-skills/"],["2026-10-23",1,"Kimi K3.1 Pro 发布","3 万亿级参数、100 万上下文，主打编程、3D 与长程 Agent 任务","月之暗面","https://www.tmtpost.com/8184064.html"],["2026-10-26",1,"GPT-6.1 Terra 发布","100 万+ token 上下文，面向长程 Agent 与知识工作的新一代旗舰","OpenAI","https://openrouter.ai/openai/gpt-6.1-terra"],["2026-10-28",1,"Gemini 4 Carbon 公布","面向高强度推理与网络安全场景的 Gemini 4 型号","Google DeepMind","https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-october-2026/"],["2026-11-10",6,"Anthropic 启动 IPO 路演（估值最高约 1.4 万亿美元）","定价区间 70–78 美元、拟募资约 640 亿美元，或成史上最大 IPO","Anthropic","https://www.cnbc.com/2026/11/10/anthropic-sets-price-range-of-70-to-78-in-upcoming-ipo.html"],["2026-11-12",7,"黄仁勋辞任英伟达 CEO","安全调查（涉间谍指控）后辞职，CFO Colette Kress 任临时 CEO，股价下跌","NVIDIA","https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-CEO-Transition/default.aspx"],["2026-11-10",7,"微软披露 Lazarus Agent 后门","改写不到 10 个休眠神经元即可给 Ag const P = DATA.papers, E = DATA.events, S = DATA.stages;
const DIRS = DATA.dirs, CATS = DATA.cats, IMPS = DATA.impacts;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('aa.'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('aa.'+k, JSON.stringify(v)); }catch(e){} }
};
let fav = new Set(STORE.get('fav',[])), read = new Set(STORE.get('read',[])), notes = STORE.get('notes',{});
const state = {view:'papers', q:'', cat:-1, onlyFav:false};

const pid = i => 'p'+i, eid = i => 'e'+i;

function counters(){
  $('#s-read').textContent = read.size;
  $('#s-fav').textContent = fav.size;
}
function chips(){
  const box = $('#chips');
  const list = state.view==='papers' ? [['全部',-1],...DIRS.map((d,i)=>[d,i])]
             : state.view==='events' ? [['全部',-1],...CATS.map((c,i)=>[c,i])] : [];
  if(!list.length){ box.innerHTML=''; return; }
  const rows = state.view==='papers' ? P : E;
  const counts = list.map(([n,i])=> i<0 ? rows.length : rows.filter(r=>r[1]===i).length);
  box.innerHTML = list.map(([n,i],k)=>`<button class="chip ${state.cat===i?'on':''}" data-c="${i}">${esc(n)}<i>${counts[k]}</i></button>`).join('')
    + (state.view==='papers' ? `<button class="chip fav ${state.onlyFav?'on':''}" id="favchip">只看收藏<i>${fav.size}</i></button>` : '');
}

function renderPapers(){
  const key = state.q.toLowerCase();
  let idx = P.map((_,i)=>i).filter(i=>{
    const r = P[i];
    if(state.onlyFav && !fav.has(pid(i))) return false;
    if(state.cat>=0 && r[1]!==state.cat) return false;
    if(!key) return true;
    return (r[2]+' '+r[4]+' '+r[3]+' '+DIRS[r[1]]).toLowerCase().includes(key);
  }).sort((a,b)=> P[a][0]<P[b][0] ? 1 : P[a][0]>P[b][0] ? -1 : 0);
  const out=[]; let last='';
  for(const i of idx){
    const r = P[i], y = r[0].slice(0,4);
    if(y!==last){ out.push(`<div class="yearmark"><b>${y}</b><i></i><em>${y==='2021'?'起点':'　'}</em></div>`); last=y; }
    const f = fav.has(pid(i)), rd = read.has(pid(i));
    out.push(`<div class="row k${r[1]%10}" data-i="${i}">
      <div class="r1"><span class="badge c${r[1]%10}">${esc(DIRS[r[1]])}</span><span class="imp i${r[6]}">${esc(IMPS[r[6]])}</span></div>
      <div class="name">${esc(r[2])}</div>
      <div class="contrib">${esc(r[3])}</div>
      <div class="sub"><span>${esc(r[0])}</span><span>${esc(r[4])}</span></div>
      ${f?'<span class="flag">★</span>':rd?'<span class="flag">✓</span>':''}
    </div>`);
  }
  paint(out, idx.length, P.length, '篇论文');
}

function renderEvents(){
  const key = state.q.toLowerCase();
  let idx = E.map((_,i)=>i).filter(i=>{
    const r = E[i];
    if(state.cat>=0 && r[1]!==state.cat) return false;
    if(!key) return true;
    return (r[2]+' '+r[4]+' '+r[3]+' '+CATS[r[1]]+' '+r[0]).toLowerCase().includes(key);
  }).sort((a,b)=> E[a][0]<E[b][0] ? 1 : E[a][0]>E[b][0] ? -1 : 0);
  const out=[]; let last='';
  for(const i of idx){
    const r = E[i], y = r[0].slice(0,4);
    if(y!==last){ out.push(`<div class="yearmark"><b>${y}</b><i></i><em>　</em></div>`); last=y; }
    const f = fav.has(eid(i));
    out.push(`<div class="row ev k${r[1]%10}" data-t="e" data-i="${i}">
      <div class="r1"><span class="pill">${esc(r[0].slice(5))}</span><span class="badge c${r[1]%10}">${esc(CATS[r[1]])}</span></div>
      <div class="name">${esc(r[2])}</div>
      <div class="contrib">${esc(r[3])}</div>
      <div class="sub"><span>${esc(r[4])}</span></div>
      ${f?'<span class="flag">★</span>':''}
    </div>`);
  }
  paint(out, idx.length, E.length, '个事件');
}

function renderStages(){
  const key = state.q.toLowerCase();
  const list = S.filter(s=> !key || (s.join(' ')).toLowerCase().includes(key));
  $('#list').innerHTML = list.length ? list.map((s,i)=>`
    <div class="stage">
      <div class="n">0${i+1}</div>
      <h3>${esc(s[0])}</h3>
      <div class="t">${esc(s[1])}</div>
      <p>${esc(s[2])}</p>
      <div class="rep">代表：${esc(s[3])}</div>
    </div>`).join('') : `<div class="empty">没有匹配的条目</div>`;
  $('#count').textContent = `六阶段框架 · 显示 ${list.length} / ${S.length}`;
}

function paint(out, n, total, unit){
  const box = $('#list');
  box.innerHTML = out.length ? out.join('') : `<div class="empty">没有匹配的条目，换个关键词或筛选试试</div>`;
  $('#count').textContent = `显示 ${n} / ${total} ${unit}`;
}

function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.view===state.view));
  chips();
  if(state.view==='papers') renderPapers();
  else if(state.view==='events') renderEvents();
  else renderStages();
  counters();
}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  state.view=b.dataset.view; state.cat=-1; state.onlyFav=false; render();
  window.scrollTo({top:0, behavior:'smooth'});
}));
$('#q').addEventListener('input', e=>{ state.q=e.target.value.trim(); render(); });
$('#chips').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  if(c.id==='favchip') state.onlyFav=!state.onlyFav;
  else state.cat = +c.dataset.c;
  render();
});

let cur = null;
function openSheet(kind, i){
  cur = {kind, i};
  const isPaper = kind==='p';
  const r = isPaper ? P[i] : E[i];
  const id = isPaper ? pid(i) : eid(i);
  $('#s-name').textContent = r[2];
  $('#s-meta').innerHTML = isPaper
    ? `<span class="badge c${r[1]%10}">${esc(DIRS[r[1]])}</span><span class="imp i${r[6]}">${esc(IMPS[r[6]])}</span><span>${esc(r[0])}</span>`
    : `<span class="badge c${r[1]%10}">${esc(CATS[r[1]])}</span><span>${esc(r[0])}</span>`;
  $('#s-body').textContent = isPaper ? r[3] : r[3];
  $('#s-dl').innerHTML = isPaper
    ? `<dt>机构</dt><dd>${esc(r[4])}</dd><dt>发表</dt><dd>${esc(r[0])}</dd><dt>arXiv</dt><dd><a href="https://arxiv.org/abs/${esc(r[5])}" target="_blank" rel="noopener">${esc(r[5])}</a></dd>`
    : `<dt>主体</dt><dd>${esc(r[4])}</dd><dt>日期</dt><dd>${esc(r[0])}</dd><dt>来源</dt><dd><a href="${esc(r[5])}" target="_blank" rel="noopener">${esc(r[5].replace(/^https?:\/\//,'').slice(0,34))}…</a></dd>`;
  $('#s-link').href = isPaper ? `https://arxiv.org/abs/${r[5]}` : r[5];
  $('#s-link').textContent = isPaper ? '查看论文' : '查看来源';
  const rb=$('#s-btn-read'), fb=$('#s-btn-fav');
  rb.style.display = isPaper ? '' : 'none';
  rb.classList.toggle('on', read.has(id)); rb.textContent = read.has(id) ? '已读 ✓' : '标记已读';
  fb.classList.toggle('on', fav.has(id)); fb.textContent = fav.has(id) ? '已收藏 ★' : '收藏';
  rb.onclick = ()=>{ read.has(id)?read.delete(id):read.add(id); STORE.set('read',[...read]); openSheet(kind,i); render(); };
  fb.onclick = ()=>{ fav.has(id)?fav.delete(id):fav.add(id); STORE.set('fav',[...fav]); openSheet(kind,i); render(); };
  $('#s-note').value = notes[id] || '';
  $('#sheet').classList.add('show');
}
function closeSheet(){ $('#sheet').classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
$('#s-note').addEventListener('input', e=>{
  if(!cur) return;
  const id = cur.kind==='p' ? pid(cur.i) : eid(cur.i);
  const v = e.target.value.trim();
  if(v) notes[id]=v; else delete notes[id];
  STORE.set('notes', notes);
});
$('#list').addEventListener('click', e=>{
  const el = e.target.closest('.row'); if(!el) return;
  openSheet(el.dataset.t==='e' ? 'e' : 'p', +el.dataset.i);
});
$('#s-total').textContent = P.length;
render();
</script>
